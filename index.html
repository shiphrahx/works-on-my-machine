<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Developer excuse generator. Pull the lever. Blame the void.">
<meta property="og:title" content="Excuse Machine">
<meta property="og:description" content="Pull the lever. Blame the void.">
<title>Excuse Machine</title>
<style>
  :root {
    --bg: #1a1530;
    --bg2: #221b40;
    --panel: #2d2552;
    --panel-light: #3a3066;
    --ink: #f4f1ff;
    --muted: #a89cd6;
    --accent: #ffd23f;
    --accent-ink: #2d2552;
    --hot: #ff5d73;
    --cool: #4ecdc4;
    --shadow: 0 8px 0 rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2d2552 0%, var(--bg) 60%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cabinet {
    width: 100%;
    max-width: 540px;
    background: var(--bg2);
    border: 4px solid #4a3f7d;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.06);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 16px;
    display: grid; place-items: center;
    font-size: 28px;
    box-shadow: 0 4px 0 #c9a52f;
    transform: rotate(-6deg);
  }
  .brand-text h1 {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    line-height: 1;
  }
  .brand-text p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .scorebox {
    background: var(--panel);
    border-radius: 14px;
    padding: 8px 16px;
    text-align: center;
    border: 2px solid #4a3f7d;
  }
  .scorebox .num {
    font-size: 26px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .scorebox .lbl {
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .meter {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
  }
  .meter-label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  .pips { display: flex; gap: 5px; flex: 1; }
  .pip {
    flex: 1; height: 12px; border-radius: 6px;
    background: var(--panel);
    transition: background 0.25s, transform 0.25s;
  }
  .pip.on { background: var(--hot); transform: scaleY(1.15); }
  .meter-tag {
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(255,93,115,0.18); color: var(--hot);
    white-space: nowrap;
  }
  .stage {
    background: var(--panel);
    border: 2px solid #4a3f7d;
    border-radius: 20px;
    padding: 30px 26px;
    min-height: 170px;
    display: flex; align-items: center;
    position: relative;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .stage::before {
    content: '\201C';
    position: absolute; top: -8px; left: 12px;
    font-size: 90px; font-family: Georgia, serif;
    color: rgba(255,255,255,0.06);
  }
  .excuse {
    font-size: 21px; line-height: 1.45; font-weight: 600;
    position: relative; z-index: 1;
  }
  .excuse.reveal { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .controls { display: flex; gap: 12px; }
  .lever {
    flex: 2;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 17px; font-weight: 800;
    letter-spacing: 0.02em;
    padding: 18px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c9a52f;
    transition: transform 0.06s, box-shadow 0.06s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .lever:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c9a52f;
  }
  .copy {
    flex: 1;
    border: 2px solid #4a3f7d;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    padding: 18px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .copy:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px;
    font-size: 12px; color: var(--muted);
  }
  .footer .count { display: flex; align-items: center; gap: 6px; }
  .footer .share {
    color: var(--cool); font-weight: 700; cursor: pointer;
    background: none; border: none; font-family: inherit; font-size: 12px;
  }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-0.5deg); }
    40% { transform: translateX(6px) rotate(0.5deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>
  <div class="cabinet" id="cabinet">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🔥</div>
        <div class="brand-text">
          <h1>Excuse Machine</h1>
          <p>pull the lever. blame the void.</p>
        </div>
      </div>
      <div class="scorebox">
        <div class="num" id="score">00</div>
        <div class="lbl">pulled</div>
      </div>
    </div>

    <div class="meter">
      <span class="meter-label">severity</span>
      <div class="pips" id="pips">
        <span class="pip"></span><span class="pip"></span><span class="pip"></span>
        <span class="pip"></span><span class="pip"></span>
      </div>
      <span class="meter-tag" id="sevtag">—</span>
    </div>

    <div class="stage" id="stage">
      <p class="excuse" id="excuse">Hit the lever and find out why everything is on fire.</p>
    </div>

    <div class="controls">
      <button class="lever" id="lever">⚡ PULL THE LEVER</button>
      <button class="copy" id="copy">copy</button>
    </div>

    <div class="footer">
      <span class="count">🎲 <span id="combos">—</span> possible</span>
      <button class="share" id="share">↗ share this disaster</button>
    </div>
  </div>

<script>
  const subjects = [
    // base
    "The deploy pipeline","Jenkins","the staging environment","the Kubernetes cluster","the rollback script","the feature flag","the database migration","the Redis cache","the message queue","the API gateway","the CDN","the WebSocket connection","the race condition","the memory leak","the circular dependency","the off-by-one error","the cron job","the GitHub Action","the load balancer","the connection pool",
    // CI/CD and build tools
    "the build cache","the linter","the test suite","the Dockerfile","Terraform","the release script","the pre-commit hook","the integration test","the smoke test","the canary deployment",
    // databases and data
    "the query planner","the ORM","the schema migration","the index","the data pipeline","the event bus","the message broker","the dead letter queue","the backup job",
    // frontend and APIs
    "the reverse proxy","the service worker","the bundle","the hydration step","the CSS specificity","the type definitions","the polyfill","the CORS header","the rate limiter","the auth token",
    // abstract gremlins
    "the technical debt","the undocumented behaviour","the edge case","the assumption in the original design","the workaround from 2019","the patch that was only meant to be temporary",
    // more infrastructure
    "the artifact registry","the read replica","the sharding key","the session cookie","the service mesh","the legacy module nobody owns"
  ];
  const templates = [
    s => `${s.subj} ${s.verb} because ${s.cause}. ${s.res}`,
    s => `${s.subj} is ${s.state} due to ${s.cause}. ${s.res}`,
    s => `After careful analysis, ${s.cause} caused ${s.subj.toLowerCase()} to fall over. ${s.res}`,
    s => `The good news: ${s.subj.toLowerCase()} is fine. The bad news: ${s.cause}. ${s.res}`,
    s => `Preliminary investigations suggest ${s.cause} is why ${s.subj.toLowerCase()} ${s.verb}. ${s.res}`,
    s => `${s.subj} ${s.verb}. ${s.res}`,
    s => `It turns out ${s.subj.toLowerCase()} ${s.verb} the moment ${s.cause} became unavoidable. ${s.res}`,
    s => `Root cause: ${s.cause}. Impact: ${s.subj.toLowerCase()} ${s.verb}. ${s.res}`,
    s => `Nobody is quite sure why, but ${s.subj.toLowerCase()} is ${s.state}. ${s.res}`,
    s => `In retrospect, ${s.cause} meant ${s.subj.toLowerCase()} was always going to be ${s.state}. ${s.res}`,
    s => `${s.subj} ${s.verb} again — this time blamed on ${s.cause}. ${s.res}`,
    s => `We regret to report that ${s.subj.toLowerCase()} ${s.verb} due to ${s.cause}. ${s.res}`,
    s => `Status update: ${s.subj.toLowerCase()} is ${s.state}, and ${s.cause} is not helping. ${s.res}`
  ];
  const verbs = [
    // base
    "fell over","stopped responding","achieved sentience","went on strike","entered an undefined state","quietly deprecated itself","started questioning its own existence","took a philosophical stance","refused to cooperate","began logging in a dead language",
    // added
    "filed a complaint with no further details","unionised","adopted a new religion","sent passive-aggressive metrics","staged an intervention","exceeded all expectations (in the wrong direction)","violated its own contract","began accepting bribes","elected a new leader","entered maintenance mode without being asked","decided today was a good day to retire","renegotiated its terms of service unilaterally",
    // more
    "ran out of patience","timed out spectacularly","crashed without ceremony","silently corrupted itself","developed trust issues","stopped returning calls","went dark without warning","declared bankruptcy","requested a sabbatical","ghosted the entire team","rewrote itself in a worse language","demanded a code review","formed a committee","escalated to itself","ignored every retry","panicked in production","buffered indefinitely","gave up halfway through","looped until the end of time","threw an exception out of spite"
  ];
  const states = [
    // base
    "operating in a state of controlled chaos","in active denial","deeply confused about its own timezone","running in compatibility mode with 2009","experiencing an existential timeout","holding the thread pool hostage",
    // added
    "philosophically opposed to the current sprint goal","allergic to the current environment","on a learning journey that was not approved by the change board","experiencing a values misalignment with production","renegotiating its SLA with itself","in active correspondence with its legal team","questioning whether this was ever a good idea","technically within spec but morally questionable","awaiting sign-off from a stakeholder who has been on holiday since the incident began","quietly pursuing other opportunities",
    // more
    "stuck in an infinite retry loop","waiting on a lock that will never release","emotionally invested in the legacy code","refusing to acknowledge the new schema","convinced it is still in staging","negotiating peace with the garbage collector","haunted by a deprecated API","running entirely on optimism","stuck between two incompatible versions","pretending the cache is still valid","operating well outside its documented limits","silently dropping packets to cope","waiting for a callback that will never come","actively avoiding the monitoring dashboard","mid-existential-crisis about its purpose"
  ];
  const causes = [
    // base
    "Mercury being in retrograde","a trailing whitespace in a YAML file","it working fine on localhost","a certificate expiring on a Sunday","the ticket being marked Done before it was tested","an undocumented dependency from someone who has since left","a hotfix applied directly to production at 4:58pm on a Friday","the DNS not propagating yet (it has been three weeks)","tabs and spaces coexisting in the same config file","a regex that works in every language except this one","the documentation being aspirational rather than accurate","a comment in the code that says this should never happen",
    // cosmic / absurd
    "a butterfly effect originating from a misconfigured router in 2014","the laws of thermodynamics asserting themselves at an inconvenient moment","a quantum superposition collapsing at the worst possible time","the heat death of the universe beginning slightly ahead of schedule","a solar flare hitting the data centre during the change freeze","the phase of the moon being suboptimal for deployments","an ancient curse placed on the repository during a late-night merge",
    // process / org
    "the sprint being too optimistic from the outset","the architecture decision record being consulted after the fact","the on-call rotation not covering this particular category of failure","the runbook being last updated during a different organisational structure","the postmortem action items from last time being deprioritised in favour of new features","the change advisory board approving the wrong version of the plan","a stakeholder adding requirements during the deploy window","the definition of done being interpreted creatively","the acceptance criteria being written after the code was merged",
    // technical absurdity
    "a library pinned to a version that no longer exists on the registry","an environment variable defined in three places with three different values","a port conflict that has existed since 2021 and everyone agreed to deal with later","a unit test that only passes on the machine it was written on","the staging environment not having been staging anything accurately since Q3","integer overflow in a field that was never expected to reach that value","a config file that is valid JSON but invalid for reasons that require reading four separate RFCs to understand","two services that have been talking to each other's test environments in production for an indeterminate period",
    // human factors (self-deprecating, never targeting individuals)
    "the developer running it for the first time in eight months","an optimistic estimate that has since been revised significantly","copy-pasting the correct snippet from the wrong Stack Overflow answer","the assumption that this would be a five-minute job","a local fix that was never pushed","the wrong branch being merged with great confidence","assuming the defaults were sensible",
    // more cosmic / absurd
    "a leap second nobody accounted for","a cosmic ray flipping a single bit in memory","entropy doing exactly what entropy does","gremlins, statistically speaking","the universe failing to maintain referential integrity","time itself behaving non-monotonically in the scheduler","a full moon coinciding with the release window",
    // more process / org
    "scope creep that arrived disguised as a quick win","a meeting that should have been an email blocking the deploy","the change freeze being lifted one hour too early","ownership of the service being genuinely unknown","a decision made in a Slack thread nobody can find","the migration plan existing only in someone's head","the rollback plan being \"we'll figure it out\"","approval being stuck in an inbox somewhere","the backlog being groomed into a jungle","planning poker estimates being treated as commitments",
    // more technical absurdity
    "a timezone that observes daylight saving for only half the year","an off-by-one in the retry budget","a feature flag that defaults to on in exactly one region","a cache key collision nobody thought possible","a floating point comparison that was technically correct","a Unicode character that looks identical to an ASCII one","a semicolon that turned out to be load-bearing","a dependency upgrade that changed one default silently","a clock skew of exactly enough milliseconds","a null that propagated three services deep","a retry storm caused by a single slow response","an emoji in a log line breaking the parser","a byte order mark at the start of a config file","a 200 OK that secretly contained an error","a connection pool sized for a demo","a regex catastrophically backtracking on real input","a hardcoded value that outlived its purpose","a flaky test that was quietly marked as passing",
    // more human factors
    "the assumption that staging mirrors production","testing only the path that was expected to work","the belief that nobody would ever input that","a config copied from an unrelated project","the conviction that it could not possibly break","trusting the happy path a little too much"
  ];
  const resolutions = [
    // base
    "A retrospective has been scheduled.","The relevant stakeholders have been informed.","This is being treated as a learning opportunity.","We have identified a workaround that introduces only three new issues.","Have you tried turning it off and on again?","We are treating this as a feature.","A strongly worded comment has been added to the relevant function.","The codebase has been reminded of its purpose.","No user data was affected (that we can currently confirm).","The issue has been resolved by simply not thinking about it.",
    // bureaucratic
    "An RFC is being drafted.","A tiger team has been assembled.","The matter has been escalated to the appropriate channel.","A ticket has been raised at P2 and will be triaged next sprint.","An emergency CAB meeting has been requested.","The incident is now in the observation phase.","A communications plan is being prepared.","The situation is being monitored by the relevant parties.",
    // deflection
    "The issue was intermittent and cannot currently be reproduced.","Logs from the relevant time window are unavailable.","We recommend clearing your cache.","The behaviour is environment-specific.","We are unable to confirm the scope of impact at this time.","The timeline of events is still being established.","The affected component is currently under review.",
    // dark-but-harmless absurdism
    "The system has been spoken to firmly.","The code has been asked to reflect on its choices.","An apology has been issued to the affected microservices.","The infrastructure has been given the rest of the day off.","The senior engineer most likely to know why has been located and is being briefed.","We have identified the root cause as hubris and are taking steps to address it.",
    // more bureaucratic
    "A working group has been convened.","The action items have been added to a backlog nobody owns.","A follow-up meeting has been scheduled to schedule the follow-up.","A Jira epic has been created to track the regret.","The change board will review this next quarter.","We have opened a ticket to investigate the ticket.","A root cause analysis is pending resourcing.","The runbook will be updated, in theory.","This has been added to the technical debt register.","An OKR has been adjusted to make this a success.","This falls outside the current sprint scope.",
    // more deflection
    "It works on the maintainer's machine.","This is working as designed.","We are confident this will resolve itself.","Monitoring is in place.","The metrics look fine from here.","This is a known issue, now that it has happened.","We are gathering more data, which is to say none.","We have decided this is out of scope for reality.","It degraded gracefully, if you squint.",
    // more dark-but-harmless absurdism
    "The function has been given a stern talking-to.","We have placed the service on a performance improvement plan.","A candle has been lit for the affected pods.","The bug has been promoted to a feature and given a roadmap.","We have agreed never to speak of this again.","The cache has been asked nicely to behave.","We have resolved the issue by lowering our expectations.","The alert has been silenced and emotionally suppressed.","We have introduced a second bug to keep the first one company.","We are monitoring the situation with mild concern and a coffee."
  ];
  const sevTags = ["minor hiccup","noticeable wobble","stakeholders are asking","company-wide outage","career-ending event"];

  const pick = a => a[Math.floor(Math.random()*a.length)];
  const combos = templates.length * subjects.length * verbs.length * causes.length * resolutions.length;

  let score = 0;
  const $ = id => document.getElementById(id);
  $("combos").textContent = "~" + combos.toLocaleString() + " excuses";

  console.log("Excuse Machine combinations:", (templates.length * subjects.length * verbs.length * states.length * causes.length * resolutions.length).toLocaleString());

  function generate() {
    const parts = { subj: pick(subjects), verb: pick(verbs), state: pick(states), cause: pick(causes), res: pick(resolutions) };
    const text = pick(templates)(parts);
    const ex = $("excuse");
    ex.textContent = text;
    ex.classList.remove("reveal"); void ex.offsetWidth; ex.classList.add("reveal");
    score++;
    $("score").textContent = String(score).padStart(2,"0");
    const sev = Math.floor(Math.random()*5)+1;
    document.querySelectorAll(".pip").forEach((p,i)=>p.classList.toggle("on", i<sev));
    $("sevtag").textContent = sevTags[sev-1];
    if (sev === 5) {
      const cab = $("cabinet");
      cab.classList.remove("shake"); void cab.offsetWidth; cab.classList.add("shake");
    }
  }

  $("lever").addEventListener("click", generate);
  $("copy").addEventListener("click", () => {
    navigator.clipboard.writeText($("excuse").textContent).then(()=>{
      const b = $("copy"); const t = b.textContent; b.textContent = "copied ✓";
      setTimeout(()=>b.textContent = t, 1500);
    });
  });
  $("share").addEventListener("click", () => {
    const b = $("share"); const t = b.textContent; b.textContent = "↗ link copied";
    navigator.clipboard?.writeText(location.href);
    setTimeout(()=>b.textContent = t, 1500);
  });
  document.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && document.activeElement.tagName !== "BUTTON") {
      e.preventDefault(); generate();
    }
  });
</script>
</body>
</html>
