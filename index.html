<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excuse Machine</title>
<style>
  :root {
    --bg: #1a1530;
    --bg2: #221b40;
    --panel: #2d2552;
    --panel-light: #3a3066;
    --ink: #f4f1ff;
    --muted: #a89cd6;
    --accent: #ffd23f;
    --accent-ink: #2d2552;
    --hot: #ff5d73;
    --cool: #4ecdc4;
    --shadow: 0 8px 0 rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2d2552 0%, var(--bg) 60%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cabinet {
    width: 100%;
    max-width: 540px;
    background: var(--bg2);
    border: 4px solid #4a3f7d;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.06);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 16px;
    display: grid; place-items: center;
    font-size: 28px;
    box-shadow: 0 4px 0 #c9a52f;
    transform: rotate(-6deg);
  }
  .brand-text h1 {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    line-height: 1;
  }
  .brand-text p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .scorebox {
    background: var(--panel);
    border-radius: 14px;
    padding: 8px 16px;
    text-align: center;
    border: 2px solid #4a3f7d;
  }
  .scorebox .num {
    font-size: 26px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .scorebox .lbl {
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .meter {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
  }
  .meter-label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }
  .pips { display: flex; gap: 5px; flex: 1; }
  .pip {
    flex: 1; height: 12px; border-radius: 6px;
    background: var(--panel);
    transition: background 0.25s, transform 0.25s;
  }
  .pip.on { background: var(--hot); transform: scaleY(1.15); }
  .meter-tag {
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;
    background: rgba(255,93,115,0.18); color: var(--hot);
    white-space: nowrap;
  }
  .stage {
    background: var(--panel);
    border: 2px solid #4a3f7d;
    border-radius: 20px;
    padding: 30px 26px;
    min-height: 170px;
    display: flex; align-items: center;
    position: relative;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .stage::before {
    content: '\201C';
    position: absolute; top: -8px; left: 12px;
    font-size: 90px; font-family: Georgia, serif;
    color: rgba(255,255,255,0.06);
  }
  .excuse {
    font-size: 21px; line-height: 1.45; font-weight: 600;
    position: relative; z-index: 1;
  }
  .excuse.reveal { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .controls { display: flex; gap: 12px; }
  .lever {
    flex: 2;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 17px; font-weight: 800;
    letter-spacing: 0.02em;
    padding: 18px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c9a52f;
    transition: transform 0.06s, box-shadow 0.06s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .lever:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c9a52f;
  }
  .copy {
    flex: 1;
    border: 2px solid #4a3f7d;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    padding: 18px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .copy:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px;
    font-size: 12px; color: var(--muted);
  }
  .footer .count { display: flex; align-items: center; gap: 6px; }
  .footer .share {
    color: var(--cool); font-weight: 700; cursor: pointer;
    background: none; border: none; font-family: inherit; font-size: 12px;
  }
  .opts {
    display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid #4a3f7d;
  }
  .opt {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .opt.grow { flex: 1; min-width: 150px; }
  .opt select {
    background: var(--panel); color: var(--ink);
    border: 2px solid #4a3f7d; border-radius: 10px;
    padding: 7px 10px; font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  .opt input[type="range"] { accent-color: var(--accent); cursor: pointer; width: 100%; }
  .tone-ends { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-0.5deg); }
    40% { transform: translateX(6px) rotate(0.5deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .excuse.reveal { animation: none; }
    .shake { animation: none; }
    .pip { transition: none; }
    .lever, .copy, .pip { transition: none; }
    * { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <div class="cabinet" id="cabinet">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🔥</div>
        <div class="brand-text">
          <h1>Excuse Machine</h1>
          <p>pull the lever. blame the void.</p>
        </div>
      </div>
      <div class="scorebox">
        <div class="num" id="score">00</div>
        <div class="lbl">pulled</div>
      </div>
    </div>

    <div class="meter">
      <span class="meter-label">severity</span>
      <div class="pips" id="pips">
        <span class="pip"></span><span class="pip"></span><span class="pip"></span>
        <span class="pip"></span><span class="pip"></span>
      </div>
      <span class="meter-tag" id="sevtag">—</span>
    </div>

    <div class="stage" id="stage">
      <p class="excuse" id="excuse">Hit the lever and find out why everything is on fire.</p>
    </div>

    <div class="controls">
      <button class="lever" id="lever">⚡ PULL THE LEVER</button>
      <button class="copy" id="copy">copy</button>
    </div>

    <div class="opts" id="opts">
      <label class="opt grow">theme
        <select id="category">
          <option value="all">everything</option>
          <option value="cosmic">cosmic</option>
          <option value="ancient">ancient / cursed</option>
          <option value="process">process</option>
          <option value="technical">technical</option>
          <option value="absurd">absurd</option>
        </select>
      </label>
    </div>

    <div class="footer">
      <span class="count">🎲 <span id="combos">—</span> possible</span>
      <button class="share" id="share">↗ share this disaster</button>
    </div>
  </div>

    "A working group has been convened.","The action items have been added to a backlog nobody owns.","A follow-up meeting has been scheduled to schedule the follow-up.","A Jira epic has been created to track the regret.","The change board will review this next quarter.","We have opened a ticket to investigate the ticket.","A root cause analysis is pending resourcing.","The runbook will be updated, in theory.","This has been added to the technical debt register.","An OKR has been adjusted to make this a success.","This falls outside the current sprint scope.",
    // more deflection
    "It works on the maintainer's machine.","This is working as designed.","We are confident this will resolve itself.","Monitoring is in place.","The metrics look fine from here.","This is a known issue, now that it has happened.","We are gathering more data, which is to say none.","We have decided this is out of scope for reality.","It degraded gracefully, if you squint.",
    // more dark-but-harmless absurdism
    "The function has been given a stern talking-to.","We have placed the service on a performance improvement plan.","A candle has been lit for the affected pods.","The bug has been promoted to a feature and given a roadmap.","We have agreed never to speak of this again.","The cache has been asked nicely to behave.","We have resolved the issue by lowering our expectations.","The alert has been silenced and emotionally suppressed.","We have introduced a second bug to keep the first one company.","We are monitoring the situation with mild concern and a coffee.",
    // even more
    "A blameless postmortem has been scheduled, mostly.","The incident has been renamed to sound less alarming.","We have added more logging to confuse the next person too.","A dashboard has been created to watch it happen again.","The fix has been merged and immediately reverted.","We have documented the workaround in a place no one will find.","A calendar reminder has been set to worry about this later.","The on-call handbook now has a new and ominous section.","We are treating the symptoms with great enthusiasm.","A second opinion has been requested from the same person.","The alert threshold has been raised until the problem disappears.","We have agreed to disagree with production.","A feature flag has been added to hide the evidence.","The metric has been redefined to look better.","We have scheduled the fix for a quieter quarter.","An incident channel has been created and then muted.","The root cause has been filed under miscellaneous.","We have asked the vendor and are awaiting silence.","A rollback has been prepared in case of courage.","The team has been reminded that it could be worse.","We have added a comment apologising in advance.","The issue has been promoted to someone else's roadmap.","A health check has been added that always passes.","We are confident the next deploy will distract everyone.","The logs have been graphed beautifully and ignored.","A standup has been added to discuss the standups.","We have resolved it by closing the tab.","The fix works locally and that is enough for today.","An RFC has been drafted and will be read eventually.","We have escalated to the universe and await its reply.","The component has been wrapped in a try/catch and a prayer.","A retro action item has been created to create retro action items.","We have decided the metric was wrong all along.","The pager has been silenced and the engineer congratulated.","We are monitoring with the calm of the truly defeated.","The behaviour has been added to the list of known features.","We have resolved this by adjusting expectations company-wide.","The cause remains a mystery we have chosen to respect.","A workaround has been deployed that only fails on weekends.","We have decided that observability was the real bug.",
    // rituals, omens, and cosmic customer service
    "An exorcist has been added to the on-call rotation.","We have consulted the stars and they were unhelpful.","A sacrifice has been made to the deployment gods.","We have translated the error into hieroglyphs for clarity.","The universe has been politely asked to reconsider.","An ancient prophecy has been updated to reflect the new timeline.","We have lit incense near the server rack.","The rubber duck has been promoted to tech lead.","We have aligned the planets and await results.","A protective ward has been placed around the legacy module.","We have appeased the gremlins with snacks.","The magic smoke has been gently encouraged to return.","We have filed a complaint with the laws of physics.","A séance has been scheduled to interview the deprecated endpoints.","We are awaiting a sign from the universe, ideally a green build.","The curse has been acknowledged and added to the backlog.","We have asked the printer nicely and feared it appropriately.","The incident has been blamed on Mercury and closed as won't-fix."
  ];
  const sevTags = ["minor hiccup","noticeable wobble","stakeholders are asking","company-wide outage","career-ending event"];

  const BANKS = { subj: subjects, verb: verbs, state: states, cause: causes, res: resolutions };
  const $ = id => document.getElementById(id);

  const combos = templates.length * subjects.length * verbs.length * causes.length * resolutions.length;
  $("combos").textContent = "~" + combos.toLocaleString() + " excuses";
  console.log("Excuse Machine combinations:", (templates.length * subjects.length * verbs.length * states.length * causes.length * resolutions.length).toLocaleString());

  let score = 0;
  let current = null;     // current excuse state: { t, subj, verb, state, cause, res }
  const recent = [];      // recent signatures, to avoid immediate repeats

  const rint = (rng, n) => Math.floor(rng() * n);
  const sigOf = st => st.t + "|" + st.cause + "|" + st.verb;
  const partsOf = st => ({ subj: subjects[st.subj], verb: verbs[st.verb], state: states[st.state], cause: causes[st.cause], res: resolutions[st.res] });

  // --- Theme / category filtering ---------------------------------------
  let currentCategory = "all";
  const CATEGORIES = {
    all:       { re: null },
    cosmic:    { re: /universe|cosmic|quantum|gravity|black hole|solar|\bmoon\b|mercury|thermodynamic|entropy|multiverse|wormhole|simulation|speed of light|dark matter|asteroid|\bspace\b|\bstars?\b|planet|constellation|big bang|heat death|leap second/i },
    ancient:   { re: /hieroglyph|pharaoh|pyramid|ancient|\brune|prophecy|\bcurse|scroll|rosetta|cave painting|\btomb|dead language|recorded history|sacred|s[eé]ance|exorcist|ritual|summon|spirit|haunt|eldritch|forbidden|incense|\bward\b|\bmagic|cursed/i },
    process:   { re: /sprint|ticket|stakeholder|postmortem|\brfc\b|\bcab\b|backlog|retro|standup|runbook|change board|change advisory|estimate|requirement|definition of done|acceptance|on-call|\bokr\b|jira|\bepic\b|meeting|approval|sign-off|\bscope|planning poker|communications|incident/i },
    technical: { re: /cache|regex|yaml|json|config|\bdns\b|certificate|timeout|\bnull\b|\bindex\b|migration|deploy|pipeline|race condition|memory|dependenc|version|\bport\b|unicode|byte order|overflow|clock|retry|queue|\block|thread|deadlock|schema|environment variable|library|connection pool|lockfile/i },
    absurd:    { re: /printer|pigeon|\bcat\b|gremlin|wizard|rubber duck|magic smoke|coffee machine|spreadsheet|horoscope|union|religion|podcast|bribe|blockchain|freelance|farm upstate|combust|duel|witness protection|streams|sentient/i }
  };
  // Precompute, for each category, the matching indices within each bank.
  for (const cat of Object.values(CATEGORIES)) {
    if (!cat.re) continue;
    cat.pools = {};
    for (const [k, arr] of Object.entries(BANKS)) {
      cat.pools[k] = arr.map((t, i) => cat.re.test(t) ? i : -1).filter(i => i >= 0);
    }
  }
  // Draw from the themed pool when it has enough entries; otherwise fall back
  // to the whole bank so generation never starves.
  function poolFor(bankName) {
    const cat = CATEGORIES[currentCategory];
    if (!cat || !cat.pools) return null;
    const pool = cat.pools[bankName];
    return (pool && pool.length >= 3) ? pool : null;
  }
  function pickIdx(rng, bankName, len) {
    const pool = poolFor(bankName);
    return pool ? pool[rint(rng, pool.length)] : rint(rng, len);
  }

  function buildState(rng) {
    return {
      t: rint(rng, templates.length),
      subj: pickIdx(rng, "subj", subjects.length),
      verb: pickIdx(rng, "verb", verbs.length),
      state: pickIdx(rng, "state", states.length),
      cause: pickIdx(rng, "cause", causes.length),
      res: pickIdx(rng, "res", resolutions.length)
    };
  }

  // Reroll a few times so the same template/cause/verb does not appear back-to-back.
  function pickState(rng, allowRepeat) {
    let st = buildState(rng);
    if (!allowRepeat) {
      let tries = 0;
      while (recent.includes(sigOf(st)) && tries < 12) { st = buildState(rng); tries++; }
    }
    return st;
  }

  // Compact, reproducible encoding of a state into the URL hash.
  function encodeState(st) {
    return [st.t, st.subj, st.verb, st.state, st.cause, st.res].map(n => n.toString(36)).join(".");
  }
  function clampIdx(v, len) { let n = parseInt(v, 36); if (isNaN(n) || n < 0) n = 0; return n % len; }
  function decodeState(h) {
    const p = String(h).split(".");
    if (p.length !== 6) return null;
    return {
      t: clampIdx(p[0], templates.length),
      subj: clampIdx(p[1], subjects.length),
      verb: clampIdx(p[2], verbs.length),
      state: clampIdx(p[3], states.length),
      cause: clampIdx(p[4], causes.length),
      res: clampIdx(p[5], resolutions.length)
    };
  }

  // Severity is derived from the chosen words, so it is meaningful and
  // reproduces identically from a shared link.
  const SEVERE_RE = /heat death|black hole|wormhole|\buniverse\b|career-ending|company-wide|bankrupt|combust|portal|ancient evil|catastroph|exorcist|sacrifice|\bcurse[ds]?\b|seize power|on fire|\boutage\b|production|pharaoh|multiverse|big bang|\bhaunt|nuclear|apocalyp|strike|seized|deprecated the team|legal|resignation/gi;
  const CALM_RE = /whitespace|semicolon|\btypo\b|cosmetic|localhost|\bminor\b|\bcomment\b|\blinter\b|trailing|\bemoji\b|\btabs?\b|\bspaces\b|refresh|known issue|working as designed|degraded gracefully/gi;
  const countMatches = (re, s) => { const m = s.match(re); return m ? m.length : 0; };
  function severityFor(st) {
    const blob = (verbs[st.verb] + " " + causes[st.cause] + " " + subjects[st.subj] + " " + states[st.state] + " " + resolutions[st.res]).toLowerCase();
    let s = 3 + countMatches(SEVERE_RE, blob) - countMatches(CALM_RE, blob);
    return Math.max(1, Math.min(5, s));
  }

  function render(st, sev) {
    current = st;
    const ex = $("excuse");
    ex.textContent = templates[st.t](partsOf(st));
    ex.classList.remove("reveal"); void ex.offsetWidth; ex.classList.add("reveal");
    document.querySelectorAll(".pip").forEach((p, i) => p.classList.toggle("on", i < sev));
    $("sevtag").textContent = sevTags[sev - 1];
    if (sev === 5) {
      const cab = $("cabinet");
      cab.classList.remove("shake"); void cab.offsetWidth; cab.classList.add("shake");
    }
    recent.push(sigOf(st));
    if (recent.length > 8) recent.shift();
    try { history.replaceState(null, "", "#" + encodeState(st)); }
    catch (e) { location.hash = encodeState(st); }
    return ex.textContent;
  }

  function generate() {
    const st = pickState(Math.random, false);
    score++;
    $("score").textContent = String(score).padStart(2, "0");
    render(st, severityFor(st));
  }

  $("lever").addEventListener("click", generate);
  if ($("category")) $("category").addEventListener("change", e => {
    currentCategory = e.target.value;
    recent.length = 0;      // small themed pools should not fight the no-repeat guard
    generate();
  });
  $("copy").addEventListener("click", () => {
    navigator.clipboard.writeText($("excuse").textContent).then(()=>{
      const b = $("copy"); const t = b.textContent; b.textContent = "copied ✓";
      setTimeout(()=>b.textContent = t, 1500);
    });
  });
  $("share").addEventListener("click", () => {
    const b = $("share"); const t = b.textContent; b.textContent = "↗ link copied";
    navigator.clipboard?.writeText(location.href);
    setTimeout(()=>b.textContent = t, 1500);
  });
  document.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "Enter") && document.activeElement.tagName !== "BUTTON") {
      e.preventDefault(); generate();
    }
  });

  // On load, reproduce the excuse encoded in the URL hash (if any).
  function initFromHash() {
    const h = location.hash.replace(/^#/, "");
    if (!h) return false;
    const st = decodeState(h);
    if (!st) return false;
    score = 1;
    $("score").textContent = "01";
    render(st, severityFor(st));
    return true;
  }
  initFromHash();
</script>
</body>
</html>
